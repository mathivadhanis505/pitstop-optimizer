services:
  - type: web
    name: pitstop-optimizer
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pitstop-optimizer-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: pitstop-optimizer-db
    databaseName: f1_pitstop
    user: postgres
    region: oregon
    plan: free

